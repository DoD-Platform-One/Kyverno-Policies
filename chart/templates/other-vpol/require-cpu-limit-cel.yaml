{{- $name := "require-cpu-limit-cel" }}
{{- if and .Values.enabled (dig $name "enabled" false .Values.celPoliciesBeta) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Require CPU Limits
    policies.kyverno.io/category: Best Practices (Security)
    policies.kyverno.io/severity: {{ default "medium" (dig $name "severity" nil .Values.celPoliciesBeta) }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      As application workloads share cluster resources, it is important to limit CPU resources
      in containers to prevent resource exhaustion and denial-of-service.  Each container should have a
      CPU limit defined.  This policy validates that all containers have CPU limits defined.
    policies.bigbang.dev/lifecycle: beta
    policies.bigbang.dev/origin: https://github.com/kyverno/policies/blob/main/other/require-cpu-limits/require-cpu-limits.yaml
  labels: {{- include "kyverno-policies.labels" . | nindent 4 }}
spec:
  {{- include "bb-kyverno-policies.validationActions" (merge (dict "name" $name) .) | indent 2 }}
  failurePolicy: {{ include "bb-kyverno-policies.vpol-failurePolicy" (merge (dict "name" $name) .) }}
  {{- include "bb-kyverno-policies.vpol-webhookTimeoutSeconds" (merge (dict "name" $name) .) | indent 2 }}
  {{- include "bb-kyverno-policies.vpol-autogenControllers" (merge (dict "name" $name) .) | indent 2 }}
  evaluation:
    background:
      enabled: {{ include "bb-kyverno-policies.vpol-background" (merge (dict "name" $name) .) }}
  {{- if dig $name "matchConstraints" nil .Values.celPoliciesBeta }}
  matchConstraints:
    {{- toYaml (dig $name "matchConstraints" nil .Values.celPoliciesBeta) | nindent 4 }}
  {{- else }}
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  {{- end }}
  {{- $nsExclude := include "bb-kyverno-policies.vpol-excludeNamespaces" (merge (dict "name" $name) .) -}}
  {{- $userConditions := dig $name "matchConditions" nil .Values.celPoliciesBeta -}}
  {{- if or $nsExclude $userConditions }}
  matchConditions:
    {{- if $nsExclude }}
    {{- $nsExclude | nindent 4 }}
    {{- end }}
    {{- with $userConditions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  variables:
  - name: allContainers
    expression: >-
      {{ include "bb-kyverno-policies.vpol-allContainers" (merge (dict "name" $name) .) }}
  validations:
    - expression: "variables.allContainers.all(container, container.?resources.?limits.?cpu.hasValue())"
      message: "CPU limits are required for all containers."
    {{- with dig $name "maxCPU" "" .Values.celPoliciesBeta }}
    {{- /* Skips containers without a CPU limit; the first validation catches those. Without this guard a missing limit would fail both validations with confusing duplicate messages. */}}
    - expression: >-
        variables.allContainers.all(container,
          !container.?resources.?limits.?cpu.hasValue() ||
          quantity(container.resources.limits.cpu).compareTo(quantity('{{ . }}')) <= 0)
      message: "CPU limits must not exceed {{ . }}."
    {{- end }}
{{- end -}}
